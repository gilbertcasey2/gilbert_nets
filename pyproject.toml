[project]
name = "gilbert_nets"
version = "0.0.4"
authors = [
  { name="Casey Elizabeth Gilbert", email="gilbert.cas@northeastern.edu" },
]
description = "A package of exciting Network Science tools."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "networkx",
  "powerlaw",
  "tailestim",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Github = "https://github.com/gilbertcasey2/gilbert_nets"